<!DOCTYPE html>
{%load static%}
<html>

<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />

  <title>Forensic Evidence Management</title>

  <!-- slider stylesheet -->
  <link rel="stylesheet" type="text/css"
    href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.1.3/assets/owl.carousel.min.css" />

  <!-- bootstrap core css -->
  <link rel="stylesheet" type="text/css" href="{%static 'css/bootstrap.css'%}" />

  <!-- fonts style -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700|Roboto:400,500&display=swap"
    rel="stylesheet" />
  <!-- Custom styles for this template -->
  <link href="{%static 'css/style.css'%}" rel="stylesheet" />
  <!-- responsive style -->
  <link href="{%static 'css/responsive.css'%}" rel="stylesheet" />
</head>

<body>
  <!-- header section strats -->
  <header class="header_section">
    <div class="container">
      <nav class="navbar navbar-expand-lg custom_nav-container ">
        <a class="navbar-brand" href="#">
          <div class="logo_box">
            Forensic Evidence Management
          </div>
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ml-auto mr-2">
            <li class="nav-item active">
              <a class="nav-link" href="/">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/login">Admin </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/pa/login">Police</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/fa/login">Forensic</a>
            </li>


          </ul>

        </div>
      </nav>
    </div>
  </header>
  <!-- end header section -->



  <!-- story section -->
  <div class="layout_padding">

    <section class="layout_padding story_section ">
      <div class="container-fluid">
        <div class="row">
          <div class=" col-md-6">
            <div>
              <img class="img-fluid" src="{%static 'img/admin.jpg'%}" alt=""  style="height:400px;width:500px;"/>
            </div>
          </div>
          <div class=" col-md-6">
            <div class="story_detail">
              <font color="red">{{msg}}</font>
              <div class="col-md-12 animated fadeIn">
                    <form action="/logaction" method="post">
                          {%csrf_token%}
                            <div class="col-md-7">
                                <h1 class="display-5 animated fadeIn mb-4"><span class="text-primary">ADMIN LOGIN </span></h1>
                            </div>
                            <div class="col-md-6">
                                <input type="text" class="form-control border-2 py-3" name="username" placeholder="UserName">
                            </div>
                                &nbsp&nbsp
                            <div class="col-md-6">
                                <input type="password" class="form-control border-2 py-3" name="password" placeholder="Password">
                            </div>
                                &nbsp&nbsp
                            <div class="col-md-6">
                            <button class="btn btn-dark border-0 w-100 py-3">Login</button>
                            </div>
                    </form>
                </div>
              <div class="story_detail-btn">

                <a href="">


                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- end story section -->



  <!-- info section -->
  <section class="info_section layout_padding">
    <div class="container">
      <div class="row">


        <div class=" col-md-4 news_container">

        </div>
      </div>
    </div>
  </section>

  <!-- end info section -->


  <!-- footer section -->
  <section class="container-fluid footer_section">
    <p>
      Copyright &copy; 2024-2025 All Rights Reserved By
      Blockchain Bases Forensic Evidence Management
    </p>
  </section>
  <!-- footer section -->

  <script type="text/javascript" src="{%static 'js/jquery-3.4.1.min.js'%}"></script>
  <script type="text/javascript" src="{%static 'js/bootstrap.js'%}"></script>
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.2.1/owl.carousel.min.js">
  </script>
  <script type="text/javascript">
    $(".owl-carousel").owlCarousel({
      loop: true,
      margin: 20,
      nav: true,
      navText: [],
      autoplay: true,
      autoplayHoverPause: true,
      responsive: {
        0: {
          items: 1
        },
        600: {
          items: 2
        },
        1000: {
          items: 3
        }
      }
    });
  </script>

  <script>
    $(".nav_search-btn").click(function () {
      if ($(".nav_search-input").hasClass("d-none")) {
        event.preventDefault();
        $(".nav_search-input")
          .animate({
              left: "-1000px"
            },
            "1000000"
          )
          .removeClass("d-none");
      } else {
        $(".nav_search-input")
          .animate({
              left: "0px"
            },
            "1000000"
          )
          .addClass("d-none");
      }
    });
  </script>



</body>

</html>
